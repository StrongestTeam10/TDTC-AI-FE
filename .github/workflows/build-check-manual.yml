name: Deploy Frontend to S3 + CloudFront

# 2026-08-04 변경: 배포 방식을 AWS CodePipeline("FE-ST10-github")으로 통일하기로
# 함(buildspec.yml 참고). 이 워크플로는 원래 s3 sync/CloudFront invalidation 단계가
# 주석 처리된 채 미완성 상태로 남아있었는데, 완성해서 쓰는 대신 CodePipeline 쪽을
# 완성하는 방향으로 결정. 두 배포 경로를 동시에 살려두면 어느 쪽이 실제 배포를
# 담당하는지 헷갈리므로, 이 워크플로는 push 시 자동 실행되지 않도록 끄고
# workflow_dispatch(수동 실행)만 남겨둠 - 필요하면 Actions 탭에서 수동으로 빌드
# 검증 용도로는 계속 쓸 수 있음.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
